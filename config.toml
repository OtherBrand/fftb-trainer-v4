# FFTB Gene Trainer V4 configuration.
# data_dir points at the shared V3 data root (tournament caches live there);
# V4 treats it as read-only. V4's own outputs go in ./data (gitignored).
data_dir = "../gene-trainer-3/data"
maps_url = "https://www.fftbattleground.com/fftbg/Maps.txt"
maps_cache = "data/Maps.txt"
# Monitoring API / web console (train --serve / serve). Owner-approved LAN
# bind (Nov 8 2026) so training nodes are watchable from any machine on the
# home network; token required — pass ?token=... on every request/URL.
monitor_bind = "0.0.0.0:8388"
monitor_token = "e47ed848a822"

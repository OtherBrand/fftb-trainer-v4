[package]
name = "fftb-v4"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fftb-trainer-v4"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"

# GA engine spike (Phase 0.5) — both candidates as dev-deps until the pick.
[dev-dependencies]
genetic_algorithms = "3.0"
radiate = { version = "1.3", features = ["rayon"] }
rayon = "1"

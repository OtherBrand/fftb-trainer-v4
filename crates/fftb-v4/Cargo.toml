[package]
name = "fftb-v4"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fftb-trainer-v4"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
toml = "0.8"
ureq = "2"
# The family GA engine (SoA, deterministic ChaCha8) + the Genome it
# populates. Pinned to the shared repo's local commit until the GitHub
# push is confirmed; then this becomes the remote URL at the same rev.
fftb-core = { git = "file:///C:/Projects/fftb-trainer-botland", rev = "022db5b" }
fftb-ga = { git = "file:///C:/Projects/fftb-trainer-botland", rev = "022db5b" }
fftb-sim = { git = "file:///C:/Projects/fftb-trainer-botland", rev = "022db5b" }
fftb-corpus = { git = "file:///C:/Projects/fftb-trainer-botland", rev = "022db5b" }
fftb-botland = { git = "file:///C:/Projects/fftb-trainer-botland", rev = "022db5b" }
rand_chacha = "0.9"
rand = "0.9"
tiny_http = "0.12"

# GA engine spike (Phase 0.5) — both candidates as dev-deps until the pick.
[dev-dependencies]
genetic_algorithms = "3.0"
radiate = { version = "1.3", features = ["rayon"] }
rayon = "1"
